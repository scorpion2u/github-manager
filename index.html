<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>链接管家</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4d4d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="链接管家">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
    <link rel="icon" type="image/png" href="icon-512.png" sizes="512x512">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-start: #dbdbdb;
            --bg-end: #c2c2c2;
            --card-bg-start: #e0e0e0;
            --card-bg-end: #c8c8c8;
            --text-primary: #2c3e2f;
            --text-secondary: #4b5563;
            --border-light: rgba(0,0,0,0.05);
            --shadow-outer: 8px 8px 16px rgba(0,0,0,0.12), -4px -4px 12px rgba(255,255,255,0.7);
            --shadow-inner: inset 3px 3px 6px rgba(0,0,0,0.08), inset -2px -2px 4px rgba(255,255,255,0.5);
            --btn-bg: linear-gradient(180deg, #e6e6e6 0%, #cccccc 100%);
            --toast-bg: #5a5a5a;
            --accent: #3b6ef6;
            --accent-soft: rgba(59,110,246,0.12);
            --danger: #c0392b;
            --transition-theme: background 0.35s ease, color 0.35s ease, box-shadow 0.35s ease;
        }
        body.dark {
            --bg-start: #2a2c30;
            --bg-end: #1c1d20;
            --card-bg-start: #303237;
            --card-bg-end: #232427;
            --text-primary: #e8e9ec;
            --text-secondary: #9ca1a8;
            --border-light: rgba(255,255,255,0.06);
            --shadow-outer: 8px 8px 18px rgba(0,0,0,0.45), -4px -4px 12px rgba(255,255,255,0.03);
            --shadow-inner: inset 3px 3px 6px rgba(0,0,0,0.4), inset -2px -2px 4px rgba(255,255,255,0.04);
            --btn-bg: linear-gradient(180deg, #35373c 0%, #26272a 100%);
            --toast-bg: #45474c;
            --accent: #6d93ff;
            --accent-soft: rgba(109,147,255,0.16);
        }
        body {
            font-family: 'Manrope', 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-start);
            background-image: radial-gradient(circle at 30% 20%, var(--bg-start) 5%, var(--bg-end) 90%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
            margin: 0;
            transition: var(--transition-theme);
        }
        .app, .category-card, .title-card, .header-btn, .icon-btn, .btn-sm-icon, .btn,
        .category-stats, .links-list, .link-item, .modal-box, .menu-popup, input, textarea {
            transition: var(--transition-theme), transform 0.15s ease, box-shadow 0.15s ease;
        }
        .app {
            width: 100%;
            max-width: 800px;
            border-radius: 32px;
            padding: 20px;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            box-shadow: 16px 16px 32px rgba(0,0,0,0.18), -10px -10px 28px rgba(255,255,255,0.4);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .title-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-radius: 32px;
            background: linear-gradient(180deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
            box-shadow: var(--shadow-outer);
        }
        .title-left { display: flex; align-items: center; gap: 14px; }
        .app-icon { font-size: 1.8rem; }
        .app-title { font-weight: 800; font-size: 1.4rem; color: var(--text-primary); }
        .title-actions { display: flex; gap: 12px; }
        .header-btn {
            width: 40px; height: 40px; border: none; border-radius: 50%; cursor: pointer;
            background: var(--btn-bg);
            box-shadow: 3px 3px 6px rgba(0,0,0,0.1), -2px -2px 4px rgba(255,255,255,0.6);
            font-size: 1.2rem;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:active { transform: scale(0.94); box-shadow: inset 3px 3px 6px rgba(0,0,0,0.15), inset -2px -2px 5px rgba(255,255,255,0.5); }
        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 30px;
            background: var(--bg-start);
            box-shadow: var(--shadow-inner);
        }
        .search-bar span { opacity: 0.5; font-size: 0.95rem; }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-primary);
            outline: none;
        }
        .search-bar input::placeholder { color: var(--text-secondary); opacity: 0.7; }
        .search-clear-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.85rem;
            opacity: 0.5;
            display: none;
            padding: 2px 4px;
        }
        .search-clear-btn.show { display: inline-flex; }
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        mark {
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 3px;
            padding: 0 2px;
        }
        .category-card.force-expand .category-body { display: block !important; }
        .link-favicon {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            vertical-align: -3px;
            margin-right: 5px;
            flex-shrink: 0;
        }
        .add-category-btn {
            background: var(--btn-bg);
            box-shadow: var(--shadow-outer);
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 8px;
        }
        .add-category-btn:active { transform: scale(0.97); box-shadow: inset 3px 3px 8px rgba(0,0,0,0.15), inset -2px -2px 5px rgba(255,255,255,0.5); }
        .category-card {
            background: linear-gradient(180deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow-outer);
            margin-bottom: 16px;
            transition: box-shadow 0.2s;
        }
        .category-card.dragging { opacity: 0.4; }
        .category-card.drag-over { box-shadow: 0 0 0 2px #3b82f6, var(--shadow-outer); }
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            gap: 10px;
        }
        .drag-handle {
            cursor: grab;
            font-size: 1.1rem;
            opacity: 0.4;
            padding: 8px 4px;
            user-select: none;
            touch-action: none;
        }
        .drag-handle:active { cursor: grabbing; }
        .collapse-btn {
            cursor: pointer;
            font-size: 0.7rem;
            opacity: 0.5;
            padding: 4px 8px;
            border-radius: 20px;
            user-select: none;
        }
        .collapse-btn:active { transform: scale(0.9); }
        .category-title {
            font-size: 1rem;
            font-weight: 700;
            flex: 1;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .category-title span.cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .category-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .category-stats {
            font-size: 0.65rem;
            background: var(--bg-start);
            padding: 4px 10px;
            border-radius: 30px;
            box-shadow: var(--shadow-inner);
        }
        .category-actions { display: flex; gap: 6px; }
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--btn-bg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.08), -2px -2px 4px rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:active { transform: scale(0.92); box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1); }
        .category-card.collapsed .category-body { display: none; }
        .category-body { padding: 0 16px 16px; border-top: 1px solid var(--border-light); }
        .links-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .link-item {
            display: flex;
            align-items: center;
            background: var(--bg-start);
            border-radius: 20px;
            padding: 10px 14px;
            gap: 8px;
            box-shadow: var(--shadow-inner);
            transition: box-shadow 0.2s;
        }
        .link-item.dragging { opacity: 0.4; }
        .link-item.drag-over { box-shadow: 0 0 0 2px #3b82f6, var(--shadow-inner); }
        .link-drag-handle {
            cursor: grab;
            font-size: 0.9rem;
            opacity: 0.3;
            padding: 8px 4px;
            user-select: none;
            touch-action: none;
        }
        .link-info {
            flex: 1;
            min-width: 0;
            -webkit-touch-callout: none;
        }
        .link-name a {
            font-weight: 700;
            font-size: 0.85rem;
            color: #1e40af;
            text-decoration: none;
            word-break: break-word;
            display: inline-block;
        }
        .link-name a:active { opacity: 0.7; }
        body.dark .link-name a { color: #7aa9ff; }
        .link-url {
            font-size: 0.65rem;
            color: var(--text-secondary);
            word-break: break-all;
        }
        .link-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-sm-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--btn-bg);
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.08), -1px -1px 3px rgba(255,255,255,0.5);
        }
        .btn-sm-icon:active { transform: scale(0.92); box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1); }
        .add-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--btn-bg);
            border-radius: 40px;
            padding: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: var(--shadow-inner);
        }
        .add-link-btn:active { transform: scale(0.97); box-shadow: inset 3px 3px 6px rgba(0,0,0,0.1); }
        .empty-links { text-align: center; padding: 20px; font-size: 0.7rem; opacity: 0.5; }
        .empty-state { text-align: center; padding: 50px 20px; background: linear-gradient(180deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%); border-radius: 32px; color: var(--text-secondary); }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box, .menu-popup {
            background: linear-gradient(145deg, var(--card-bg-start), var(--card-bg-end));
            border-radius: 32px;
            padding: 24px;
            width: 90%;
            max-width: 340px;
            box-shadow: 20px 20px 40px rgba(0,0,0,0.3), -12px -12px 24px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .menu-popup .btn { margin: 0; justify-content: center; }
        .modal-title { font-weight: 700; font-size: 1rem; text-align: center; color: var(--text-primary); }
        .modal-box input, .modal-box textarea, .modal-box select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 28px;
            background: var(--bg-start);
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.08), inset -2px -2px 4px rgba(255,255,255,0.5);
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .modal-box select { appearance: none; -webkit-appearance: none; cursor: pointer; }
        .row-buttons { display: flex; gap: 12px; }
        .row-buttons .btn { flex: 1; margin: 0; }
        .btn {
            border: none;
            border-radius: 40px;
            padding: 12px 16px;
            cursor: pointer;
            background: var(--btn-bg);
            box-shadow: 4px 4px 8px rgba(0,0,0,0.1), -3px -3px 6px rgba(255,255,255,0.6);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.97); box-shadow: inset 3px 3px 8px rgba(0,0,0,0.15), inset -2px -2px 5px rgba(255,255,255,0.5); }
        .btn-danger { color: #c0392b; font-weight: 700; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: white;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.8rem;
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        footer { text-align: center; font-size: 0.6rem; color: var(--text-secondary); margin-top: 8px; }
        .export-preview {
            background: var(--bg-start);
            border-radius: 16px;
            padding: 12px;
            max-height: 250px;
            overflow: auto;
            font-size: 0.7rem;
            white-space: pre-wrap;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.08), inset -2px -2px 4px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
<div class="app">
    <div class="title-card">
        <div class="title-left"><span class="app-icon">📂</span><span class="app-title">链接管家</span></div>
        <div class="title-actions">
            <button class="header-btn" id="themeToggleBtn" aria-label="切换深色模式">🌙</button>
            <button class="header-btn" id="menuBtn" aria-label="打开菜单">☰</button>
        </div>
    </div>

    <div class="search-bar">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="搜索分类或链接..." aria-label="搜索">
        <button class="search-clear-btn" id="searchClearBtn" aria-label="清空搜索">✕</button>
    </div>

    <div id="categoriesContainer" class="categories-container"></div>

    <div class="add-category-btn" id="addCategoryBtn">➕ 添加新分类</div>
    <footer>长按 ⋮⋮ 拖拽排序 | 长按链接 弹出快捷菜单 | 点击链接名直接跳转</footer>
</div>

<!-- 菜单弹窗 -->
<div class="modal-overlay" id="menuOverlay">
    <div class="menu-popup">
        <button class="btn" id="exportNotesBtn">📋 导出笔记</button>
        <button class="btn" id="exportBackupBtn">💾 导出备份</button>
        <button class="btn" id="importBtn">📂 导入数据（JSON备份）</button>
        <button class="btn" id="importNotesBtn">📝 导入笔记（粘贴文本）</button>
        <button class="btn btn-danger" id="clearAllBtn">⚠️ 清理所有数据</button>
        <button class="btn" id="menuCloseBtn">关闭</button>
    </div>
</div>

<!-- 笔记反向导入 -->
<div class="modal-overlay" id="notesImportOverlay">
    <div class="modal-box">
        <div class="modal-title">📝 从笔记导入</div>
        <div style="font-size:0.68rem;opacity:0.6;text-align:center;">粘贴之前用「导出笔记」生成的文本，即可还原分类与链接</div>
        <textarea id="notesImportInput" rows="8" placeholder="粘贴笔记文本..."></textarea>
        <div class="row-buttons" style="flex-direction:column;">
            <button class="btn" id="notesMergeImportBtn">🔄 合并导入</button>
            <button class="btn" id="notesOverwriteImportBtn">📌 覆盖导入</button>
            <button class="btn" id="notesImportCancelBtn">取消</button>
        </div>
    </div>
</div>

<!-- 导入模式选择 -->
<div class="modal-overlay" id="importModeOverlay">
    <div class="modal-box">
        <div class="modal-title">📂 选择导入方式</div>
        <div class="row-buttons" style="flex-direction:column;">
            <button class="btn" id="overwriteImportBtn">📌 覆盖导入</button>
            <button class="btn" id="mergeImportBtn">🔄 合并导入</button>
            <button class="btn" id="cancelImportBtn">取消</button>
        </div>
    </div>
</div>

<!-- 导出笔记 -->
<div class="modal-overlay" id="notesOverlay">
    <div class="modal-box">
        <div class="modal-title">📝 导出笔记</div>
        <div class="export-preview" id="notesPreview"></div>
        <div class="row-buttons">
            <button class="btn" id="copyNotesBtn">📋 复制</button>
            <button class="btn" id="downloadNotesBtn">💾 下载</button>
            <button class="btn" id="closeNotesBtn">关闭</button>
        </div>
    </div>
</div>

<!-- 分类编辑弹窗 -->
<div class="modal-overlay" id="categoryModal">
    <div class="modal-box">
        <div class="modal-title" id="categoryModalTitle">添加分类</div>
        <input type="text" id="categoryNameInput" placeholder="分类名称">
        <div class="row-buttons">
            <button class="btn" id="categorySaveBtn">保存</button>
            <button class="btn" id="categoryCancelBtn">取消</button>
        </div>
    </div>
</div>

<!-- 链接编辑弹窗 -->
<div class="modal-overlay" id="linkModal">
    <div class="modal-box">
        <div class="modal-title" id="linkModalTitle">添加链接</div>
        <select id="linkCategorySelect"></select>
        <input type="text" id="linkNameInput" placeholder="链接名称">
        <input type="text" id="linkUrlInput" placeholder="https://...">
        <textarea id="linkDescInput" rows="2" placeholder="说明（可选）"></textarea>
        <div class="row-buttons">
            <button class="btn" id="linkSaveBtn">保存</button>
            <button class="btn" id="linkCancelBtn">取消</button>
        </div>
    </div>
</div>

<!-- 链接快捷菜单（长按触发） -->
<div class="modal-overlay" id="linkContextMenuOverlay">
    <div class="menu-popup">
        <div class="modal-title" id="contextMenuTitle" style="font-size:0.8rem;opacity:0.65;font-weight:600;"></div>
        <button class="btn" id="ctxOpenBtn">🔗 打开链接</button>
        <button class="btn" id="ctxCopyBtn">📋 复制链接</button>
        <button class="btn" id="ctxEditBtn">✏️ 编辑</button>
        <button class="btn btn-danger" id="ctxDeleteBtn">🗑️ 删除</button>
        <button class="btn" id="ctxCancelBtn">取消</button>
    </div>
</div>

<!-- 清理确认 -->
<div class="modal-overlay" id="clearConfirmOverlay">
    <div class="modal-box">
        <div class="modal-title">⚠️ 危险操作</div>
        <div class="modal-message">清空后将删除所有分类和链接！</div>
        <input type="text" id="clearConfirmInput" placeholder='输入"确认删除"'>
        <div class="row-buttons">
            <button class="btn" id="clearConfirmCancel">取消</button>
            <button class="btn btn-danger" id="clearConfirmOk" disabled>确认</button>
        </div>
    </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none;">
<div class="toast" id="toastMsg"></div>

<script>
// ======================= 数据模块 =======================
const IDB = {
    dbName: 'link_manager_db',
    storeName: 'kv',
    db: null,
    open() {
        if (this.db) return Promise.resolve(this.db);
        return new Promise((resolve, reject) => {
            if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
            const req = indexedDB.open(this.dbName, 1);
            req.onupgradeneeded = () => { req.result.createObjectStore(this.storeName); };
            req.onsuccess = () => { this.db = req.result; resolve(this.db); };
            req.onerror = () => reject(req.error);
        });
    },
    async get(key) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(this.storeName, 'readonly');
            const req = tx.objectStore(this.storeName).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    },
    async set(key, value) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
        });
    }
};

const Storage = {
    key: 'category_link_manager_v6',
    async save(data) {
        try { await IDB.set(this.key, data); return true; }
        catch(e) {
            console.warn('IndexedDB 写入失败，回退到 localStorage', e);
            try { localStorage.setItem(this.key, JSON.stringify(data)); return true; }
            catch(e2) { if(e2.name === 'QuotaExceededError') alert('存储空间已满！请导出备份后清理。'); return false; }
        }
    },
    async load() {
        try {
            const idbData = await IDB.get(this.key);
            if (idbData) return idbData;
            const raw = localStorage.getItem(this.key);
            if (raw) { const parsed = JSON.parse(raw); await IDB.set(this.key, parsed); return parsed; }
            return { categories: [], nextCategoryId: 1, nextLinkId: 1 };
        } catch(e) {
            console.warn('IndexedDB 读取失败，回退到 localStorage', e);
            const raw = localStorage.getItem(this.key);
            return raw ? JSON.parse(raw) : { categories: [], nextCategoryId: 1, nextLinkId: 1 };
        }
    }
};

const AppData = {
    categories: [],
    nextCategoryId: 1,
    nextLinkId: 1,
    async init() {
        const saved = await Storage.load();
        this.categories = saved.categories || [];
        this.nextCategoryId = saved.nextCategoryId || 1;
        this.nextLinkId = saved.nextLinkId || 1;
        this.save();
    },
    save() { Storage.save({ categories: this.categories, nextCategoryId: this.nextCategoryId, nextLinkId: this.nextLinkId }); },
    addCategory(name) {
        this.categories.push({ id: this.nextCategoryId++, name, links: [], collapsed: false });
        this.save();
    },
    updateCategory(id, name) {
        const cat = this.categories.find(c => c.id === id);
        if (cat) cat.name = name;
        this.save();
    },
    deleteCategory(id) {
        this.categories = this.categories.filter(c => c.id !== id);
        this.save();
    },
    toggleCollapse(id) {
        const cat = this.categories.find(c => c.id === id);
        if (cat) cat.collapsed = !cat.collapsed;
        this.save();
    },
    reorderCategories(newOrder) { this.categories = newOrder; this.save(); },
    addLink(categoryId, name, url, description) {
        const cat = this.categories.find(c => c.id === categoryId);
        if (cat) {
            cat.links.push({ id: this.nextLinkId++, name, url, description: description || '' });
            this.save();
        }
    },
    updateLink(categoryId, linkId, name, url, description, newCategoryId) {
        const cat = this.categories.find(c => c.id === categoryId);
        if (!cat) return;
        const link = cat.links.find(l => l.id === linkId);
        if (!link) return;
        link.name = name; link.url = url; link.description = description || '';
        if (newCategoryId && newCategoryId !== categoryId) {
            const target = this.categories.find(c => c.id === newCategoryId);
            if (target) {
                cat.links = cat.links.filter(l => l.id !== linkId);
                target.links.push(link);
            }
        }
        this.save();
    },
    deleteLink(categoryId, linkId) {
        const cat = this.categories.find(c => c.id === categoryId);
        if (cat) cat.links = cat.links.filter(l => l.id !== linkId);
        this.save();
    },
    reorderLinks(categoryId, newOrder) {
        const cat = this.categories.find(c => c.id === categoryId);
        if (cat) cat.links = newOrder;
        this.save();
    },
    getAllData() { return { categories: this.categories, nextCategoryId: this.nextCategoryId, nextLinkId: this.nextLinkId }; },
    importData(data, mode) {
        if (mode === 'overwrite') {
            this.categories = data.categories || [];
            this.nextCategoryId = data.nextCategoryId || 1;
            this.nextLinkId = data.nextLinkId || 1;
        } else {
            for (const newCat of (data.categories || [])) {
                const exists = this.categories.find(c => c.name === newCat.name);
                if (exists) {
                    for (const newLink of (newCat.links || [])) {
                        const linkExists = exists.links.find(l => l.url === newLink.url);
                        if (!linkExists) exists.links.push({ id: this.nextLinkId++, ...newLink });
                    }
                } else {
                    const newLinks = (newCat.links || []).map(l => ({ id: this.nextLinkId++, ...l }));
                    this.categories.push({ id: this.nextCategoryId++, name: newCat.name, links: newLinks, collapsed: false });
                }
            }
        }
        this.save();
    }
};

function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])); }

function highlightText(text, q) {
    if (!q) return escapeHtml(text);
    const str = String(text);
    const lower = str.toLowerCase();
    const ql = q.toLowerCase();
    let result = '', i = 0, idx;
    while ((idx = lower.indexOf(ql, i)) !== -1) {
        result += escapeHtml(str.slice(i, idx));
        result += '<mark>' + escapeHtml(str.slice(idx, idx + q.length)) + '</mark>';
        i = idx + q.length;
    }
    result += escapeHtml(str.slice(i));
    return result;
}

function getFaviconUrl(url) {

// 拖拽排序
let dragState = {
    isDragging: false,
    dragType: null,
    dragElement: null,
    dragId: null,
    dragCategoryId: null,
    startX: 0, startY: 0,
    hasMoved: false,
    targetElement: null,
    targetId: null,
    targetCategoryId: null
};

function initDragAndDrop() {
    document.querySelectorAll('.drag-handle, .link-drag-handle').forEach(handle => {
        handle.addEventListener('touchstart', onDragStart, { passive: false });
        handle.addEventListener('mousedown', onDragStart);
    });
}

function onDragStart(e) {
    e.preventDefault();
    const handle = e.target.closest('[data-drag-type]');
    if (!handle) return;
    
    dragState.dragType = handle.dataset.dragType;
    dragState.dragId = dragState.dragType === 'category' ? handle.dataset.categoryId : handle.dataset.linkId;
    dragState.dragCategoryId = handle.dataset.categoryId;
    dragState.dragElement = handle.closest(dragState.dragType === 'category' ? '.category-card' : '.link-item');
    dragState.startX = e.touches ? e.touches[0].clientX : e.clientX;
    dragState.startY = e.touches ? e.touches[0].clientY : e.clientY;
    dragState.hasMoved = false;
    
    if (!dragState.dragElement) return;
    
    dragState.isDragging = true;
    dragState.dragElement.classList.add('dragging');
    
    if (e.type === 'touchstart') {
        document.addEventListener('touchmove', onDragMove);
        document.addEventListener('touchend', onDragEnd);
    } else {
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);
    }
}

function onDragMove(e) {
    if (!dragState.isDragging) return;
    e.preventDefault();
    
    const currentX = e.touches ? e.touches[0].clientX : e.clientX;
    const currentY = e.touches ? e.touches[0].clientY : e.clientY;
    const deltaX = Math.abs(currentX - dragState.startX);
    const deltaY = Math.abs(currentY - dragState.startY);
    
    if (!dragState.hasMoved && (deltaX > 5 || deltaY > 5)) {
        dragState.hasMoved = true;
    }
    
    if (!dragState.hasMoved) return;
    
    if (dragState.dragElement) {
        dragState.dragElement.style.transform = `translateY(${currentY - dragState.startY}px)`;
        dragState.dragElement.style.transition = 'none';
    }
    
    const elemUnderCursor = document.elementsFromPoint(currentX, currentY);
    let target = null;
    for (let el of elemUnderCursor) {
        if (dragState.dragType === 'category' && el.classList && el.classList.contains('category-card') && el !== dragState.dragElement) {
            target = el;
            break;
        }
        if (dragState.dragType === 'link' && el.classList && el.classList.contains('link-item') && el !== dragState.dragElement) {
            if (el.dataset.categoryId === dragState.dragCategoryId) {
                target = el;
                break;
            }
        }
    }
    
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (target) {
        target.classList.add('drag-over');
        dragState.targetElement = target;
        dragState.targetId = dragState.dragType === 'category' ? target.dataset.categoryId : target.dataset.linkId;
        dragState.targetCategoryId = target.dataset.categoryId;
    } else {
        dragState.targetElement = null;
        dragState.targetId = null;
        dragState.targetCategoryId = null;
    }
}

function onDragEnd(e) {
    if (!dragState.isDragging) return;
    
    if (dragState.dragElement) {
        dragState.dragElement.style.transform = '';
        dragState.dragElement.style.transition = '';
        dragState.dragElement.classList.remove('dragging');
    }
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    
    if (dragState.hasMoved && dragState.targetElement && dragState.targetId) {
        if (dragState.dragType === 'category') {
            const categories = [...AppData.categories];
            const fromIdx = categories.findIndex(c => c.id == dragState.dragId);
            const toIdx = categories.findIndex(c => c.id == dragState.targetId);
            if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
                const [moved] = categories.splice(fromIdx, 1);
                categories.splice(toIdx, 0, moved);
                AppData.reorderCategories(categories);
                render();
                showToast('分类顺序已更新');
            }
        } else if (dragState.dragType === 'link' && dragState.dragCategoryId === dragState.targetCategoryId) {
            const catId = parseInt(dragState.dragCategoryId);
            const cat = AppData.categories.find(c => c.id === catId);
            if (cat) {
                const links = [...cat.links];
                const fromIdx = links.findIndex(l => l.id == dragState.dragId);
                const toIdx = links.findIndex(l => l.id == dragState.targetId);
                if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
                    const [moved] = links.splice(fromIdx, 1);
                    links.splice(toIdx, 0, moved);
                    AppData.reorderLinks(catId, links);
                    render();
                    showToast('链接顺序已更新');
                }
            }
        }
    }
    
    dragState = {
        isDragging: false,
        dragType: null,
        dragElement: null,
        dragId: null,
        dragCategoryId: null,
        startX: 0, startY: 0,
        hasMoved: false,
        targetElement: null,
        targetId: null,
        targetCategoryId: null
    };
    
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend', onDragEnd);
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
}

// 其他功能
function generateNotes() {
    let text = `📂 我的链接分类\n生成时间: ${new Date().toLocaleString()}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
    for (const cat of AppData.categories) {
        text += `【${cat.name}】 (${cat.links.length}个链接)\n`;
        cat.links.forEach((link, idx) => { text += `  ${idx+1}. ${link.name}\n     链接: ${link.url}\n     说明: ${link.description || '无'}\n\n`; });
        text += '\n';
    }
    return text;
}

function parseNotesText(text) {
    const lines = text.split(/\r?\n/);
    const categories = [];
    let currentCat = null, currentLink = null;
    let catId = 1, linkId = 1;
    for (const raw of lines) {
        const line = raw.trim();
        const catMatch = line.match(/^【(.+?)】/);
        if (catMatch) {
            currentCat = { id: catId++, name: catMatch[1].trim(), links: [], collapsed: false };
            categories.push(currentCat);
            currentLink = null;
            continue;
        }
        if (!currentCat) continue;
        const linkMatch = line.match(/^\d+[\.\、]\s*(.+)$/);
        if (linkMatch) {
            currentLink = { id: linkId++, name: linkMatch[1].trim(), url: '', description: '' };
            currentCat.links.push(currentLink);
            continue;
        }
        const urlMatch = line.match(/^链接[:：]\s*(.+)$/);
        if (urlMatch && currentLink) { currentLink.url = urlMatch[1].trim(); continue; }
        const descMatch = line.match(/^说明[:：]\s*(.+)$/);
        if (descMatch && currentLink) {
            const d = descMatch[1].trim();
            currentLink.description = (d === '无') ? '' : d;
        }
    }
    categories.forEach(c => { c.links = c.links.filter(l => { try { new URL(l.url); return true; } catch(e) { return false; } }); });
    return { categories, nextCategoryId: catId, nextLinkId: linkId };
}

// 搜索
function applySearch(query) {
    const q = query.trim().toLowerCase();
    const container = document.getElementById('categoriesContainer');
    let existingEmpty = document.getElementById('noResultsMsg');
    if (existingEmpty) existingEmpty.remove();
    if (!AppData.categories.length) return;
    let anyMatch = false;
    document.querySelectorAll('.category-card').forEach(card => {
        const catId = parseInt(card.dataset.categoryId);
        const cat = AppData.categories.find(c => c.id === catId);
        if (!cat) return;
        const catNameEl = card.querySelector('.cat-name');
        if (catNameEl) catNameEl.innerHTML = highlightText(cat.name, q);
        const catNameMatch = !q || cat.name.toLowerCase().includes(q);
        let catHasMatch = catNameMatch;
        card.querySelectorAll('.link-item').forEach(item => {
            const linkId = parseInt(item.dataset.linkId);
            const link = cat.links.find(l => l.id === linkId);
            if (!link) return;
            const match = !q || catNameMatch || (
                link.name.toLowerCase().includes(q) ||
                link.url.toLowerCase().includes(q) ||
                (link.description || '').toLowerCase().includes(q)
            );
            const nameLinkEl = item.querySelector('.link-name a');
            const urlEl = item.querySelector('.link-url');
            const descEl = item.querySelector('.link-desc');
            const showHighlight = q && !catNameMatch;
            if (nameLinkEl) nameLinkEl.innerHTML = highlightText(link.name, showHighlight ? q : '');
            if (urlEl) urlEl.innerHTML = highlightText(link.url, showHighlight ? q : '');
            if (descEl) descEl.innerHTML = highlightText(link.description || '', showHighlight ? q : '');
            item.style.display = match ? '' : 'none';
            if (match) catHasMatch = true;
        });
        card.style.display = catHasMatch ? '' : 'none';
        card.classList.toggle('force-expand', !!q && catHasMatch);
        if (catHasMatch) anyMatch = true;
    });
    if (q && !anyMatch) {
        const msg = document.createElement('div');
        msg.className = 'no-results';
        msg.id = 'noResultsMsg';
        msg.textContent = `🔍 没有找到与「${query.trim()}」相关的内容`;
        container.appendChild(msg);
    }
}
const searchInput = document.getElementById('searchInput');
const searchClearBtn = document.getElementById('searchClearBtn');
searchInput.addEventListener('input', (e) => {
    searchClearBtn.classList.toggle('show', !!e.target.value);
    applySearch(e.target.value);
});
searchClearBtn.onclick = () => { searchInput.value = ''; searchClearBtn.classList.remove('show'); applySearch(''); searchInput.focus(); };

let longPressTimer = null;
let longPressTriggered = false;
function bindLongPress() {
    document.querySelectorAll('.link-item .link-info').forEach(info => {
        const item = info.closest('.link-item');
        const start = () => {
            longPressTriggered = false;
            longPressTimer = setTimeout(() => {
                longPressTriggered = true;
                if (navigator.vibrate) navigator.vibrate(15);
                openLinkContextMenu(item);
            }, 480);
        };
        const cancel = () => clearTimeout(longPressTimer);
        info.addEventListener('touchstart', start, { passive: true });
        info.addEventListener('touchend', cancel);
        info.addEventListener('touchmove', cancel);
        info.addEventListener('mousedown', start);
        info.addEventListener('mouseup', cancel);
        info.addEventListener('mouseleave', cancel);
        info.addEventListener('contextmenu', (e) => e.preventDefault());
        const a = info.querySelector('a');
        if (a) a.addEventListener('click', (e) => { if (longPressTriggered) { e.preventDefault(); longPressTriggered = false; } });
    });
}
function openLinkContextMenu(item) {
    contextMenuCategoryId = parseInt(item.dataset.categoryId);
    contextMenuLinkId = parseInt(item.dataset.linkId);
    const cat = AppData.categories.find(c => c.id === contextMenuCategoryId);
    const link = cat && cat.links.find(l => l.id === contextMenuLinkId);
    if (!link) return;
    document.getElementById('contextMenuTitle').textContent = link.name;
    document.getElementById('linkContextMenuOverlay').classList.add('show');
}
function getContextLink() {
    const cat = AppData.categories.find(c => c.id === contextMenuCategoryId);
    return cat ? cat.links.find(l => l.id === contextMenuLinkId) : null;
}
document.getElementById('ctxOpenBtn').onclick = () => {
    const link = getContextLink();
    document.getElementById('linkContextMenuOverlay').classList.remove('show');
    if (link) window.open(link.url, '_blank', 'noopener');
};
document.getElementById('ctxCopyBtn').onclick = () => {
    const link = getContextLink();
    document.getElementById('linkContextMenuOverlay').classList.remove('show');
    if (link) { navigator.clipboard.writeText(link.url); showToast('✅ 链接已复制'); }
};
document.getElementById('ctxEditBtn').onclick = () => {
    const link = getContextLink();
    document.getElementById('linkContextMenuOverlay').classList.remove('show');
    if (!link) return;
    currentCategoryIdForLink = contextMenuCategoryId; editingLinkId = contextMenuLinkId;
    document.getElementById('linkModalTitle').textContent = '编辑链接';
    document.getElementById('linkNameInput').value = link.name;
    document.getElementById('linkUrlInput').value = link.url;
    document.getElementById('linkDescInput').value = link.description || '';
    populateCategorySelect(currentCategoryIdForLink);
    document.getElementById('linkModal').classList.add('show');
};
document.getElementById('ctxDeleteBtn').onclick = () => {
    document.getElementById('linkContextMenuOverlay').classList.remove('show');
    if (confirm('确定删除此链接？')) { AppData.deleteLink(contextMenuCategoryId, contextMenuLinkId); render(); showToast('已删除'); }
};
document.getElementById('ctxCancelBtn').onclick = () => document.getElementById('linkContextMenuOverlay').classList.remove('show');

// 深色模式
const themeToggleBtn = document.getElementById('themeToggleBtn');
function applyTheme(isDark) {
    document.body.classList.toggle('dark', isDark);
    themeToggleBtn.textContent = isDark ? '☀️' : '🌙';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#1c1d20' : '#d4d4d4');
}
const savedTheme = localStorage.getItem('link_manager_theme');
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);
themeToggleBtn.onclick = () => {
    const isDark = !document.body.classList.contains('dark');
    applyTheme(isDark);
    localStorage.setItem('link_manager_theme', isDark ? 'dark' : 'light');
};

(async () => {
    await AppData.init();
    render();
    handleShareIntent();
})();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW失败', err)); }); }

// Web Share Target：从系统分享菜单接收链接
function handleShareIntent() {
    const params = new URLSearchParams(window.location.search);
    const sharedTitle = params.get('title') || '';
    const sharedText = params.get('text') || '';
    let sharedUrl = params.get('url') || '';
    if (!sharedUrl) {
        const urlInText = (sharedText.match(/https?:\/\/\S+/) || [])[0];
        if (urlInText) sharedUrl = urlInText;
    }
    if (!sharedUrl && !sharedText && !sharedTitle) return;
    history.replaceState(null, '', window.location.pathname);
    if (!AppData.categories.length) { AppData.addCategory('分享收藏'); render(); }
    currentCategoryIdForLink = AppData.categories[0].id;
    editingLinkId = null;
    document.getElementById('linkModalTitle').textContent = '添加链接（来自分享）';
    document.getElementById('linkNameInput').value = sharedTitle || sharedText.replace(sharedUrl, '').trim() || sharedUrl;
    document.getElementById('linkUrlInput').value = sharedUrl;
    document.getElementById('linkDescInput').value = '';
    populateCategorySelect(currentCategoryIdForLink);
    document.getElementById('linkModal').classList.add('show');
}
